<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTD6 Interactive Crosspath Guide | Justin Wu</title>
    <link rel="icon" type="image/png" href="ninja.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../project.css">
    <style>
        .hero-with-icon {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            flex-wrap: wrap;
        }

        .hero-with-icon img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .btd-layout {
            display: grid;
            grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr);
            gap: 1.25rem;
            align-items: start;
        }

        .filters {
            position: sticky;
            top: 1rem;
        }

        .filter-list {
            display: grid;
            gap: 0.4rem;
            margin-top: 0.85rem;
        }

        .filter-btn {
            min-height: 2.4rem;
            padding: 0.45rem 0.75rem;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--muted);
            font: inherit;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--ink);
            background: var(--accent-soft);
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        #monkey-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            align-items: start;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--muted);
            font-style: italic;
            border: 1px dashed var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.7);
        }

        .monkey-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .type-border-Military { border-left: 5px solid #b42318; }
        .type-border-Primary { border-left: 5px solid #1f4f78; }
        .type-border-Magic { border-left: 5px solid #6941c6; }
        .type-border-Support { border-left: 5px solid #b54708; }

        .card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.1rem;
            border: 0;
            background: transparent;
            cursor: pointer;
            text-align: left;
            font: inherit;
            color: inherit;
        }

        .card-header:hover {
            background: var(--accent-soft);
        }

        .card-header:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .card-title-wrap {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            flex-wrap: wrap;
            min-width: 0;
        }

        .card-title-wrap h3 {
            margin: 0;
            font-family: var(--serif);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            flex-shrink: 0;
        }

        .type-badge {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 0.2rem 0.4rem;
        }

        .chevron {
            color: var(--muted);
            transition: transform 0.2s ease;
            font-size: 0.85rem;
        }

        .monkey-card.open .chevron {
            transform: rotate(180deg);
        }

        .details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            background: #f8fafc;
            border-top: 0 solid var(--line);
        }

        .monkey-card.open .details {
            max-height: 2400px;
            border-top-width: 1px;
        }

        .upgrade {
            padding: 1rem 1.1rem;
            border-top: 1px solid var(--line);
        }

        .upgrade:first-child {
            border-top: 0;
        }

        .upgrade-top {
            display: flex;
            justify-content: space-between;
            gap: 0.85rem;
            align-items: flex-start;
        }

        .rank {
            font-family: var(--serif);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent);
            opacity: 0.45;
            line-height: 1;
            min-width: 2.25rem;
        }

        .upgrade-body {
            flex: 1;
            min-width: 0;
        }

        .upgrade-body h4 {
            margin: 0;
            font-family: var(--serif);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .crosspath-label {
            margin: 0.2rem 0 0;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .crosspath {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .crosspath span {
            width: 1.85rem;
            height: 1.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .path-0 { background: #b42318; }
        .path-1 { background: #1f4f78; }
        .path-2 { background: #067647; }

        .ability-icons {
            display: flex;
            gap: 0.35rem;
            margin: 0.55rem 0;
            align-items: center;
        }

        .ability-icons img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .ability-icons .off {
            opacity: 0.22;
            filter: grayscale(1);
        }

        .notes {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .upgrade-row {
            display: flex;
            gap: 0.85rem;
            align-items: flex-start;
        }

        @media (max-width: 900px) {
            .btd-layout {
                grid-template-columns: 1fr;
            }

            .filters {
                position: static;
            }

            #monkey-grid {
                grid-template-columns: 1fr;
            }

            .filter-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="../">Justin Wu</a>
            <nav class="nav-links">
                <a href="../">Back to portfolio</a>
            </nav>
        </header>

        <section class="demo-hero">
            <div class="hero-with-icon">
                <img src="ninja.png" alt="" width="48" height="48">
                <div>
                    <p class="eyebrow">Interactive guide</p>
                    <h1>BTD6 Crosspath Guide</h1>
                </div>
            </div>
            <p>Tier 5 crosspath recommendations for Bloons TD 6 — filter by tower type, search upgrades, and expand a card for notes.</p>
        </section>

        <div class="btd-layout">
            <aside class="panel filters controls">
                <h2>Controls</h2>
                <div class="field">
                    <label for="search-input">Search</label>
                    <input type="search" id="search-input" placeholder="Search monkeys or upgrades…">
                </div>
                <div class="field">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select">
                        <option value="name">Name</option>
                        <option value="rank">Best path rank</option>
                        <option value="type">Type</option>
                    </select>
                </div>
                <div id="filter-container" class="filter-list" role="group" aria-label="Filter by type">
                    <button type="button" class="filter-btn active" data-type="all">All monkeys</button>
                    <button type="button" class="filter-btn" data-type="Primary">Primary</button>
                    <button type="button" class="filter-btn" data-type="Military">Military</button>
                    <button type="button" class="filter-btn" data-type="Magic">Magic</button>
                    <button type="button" class="filter-btn" data-type="Support">Support</button>
                </div>
            </aside>

            <main id="monkey-grid" aria-live="polite"></main>
        </div>
    </div>

    <script>
        const crosspathData = {
            "monkeys": [
                { "type": "Primary", "name": "Dart Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Ultra-Juggernaut", "crosspath": "5-0-2", "notes": "5-0-2 is generally better for the extra range and camo detection. 5-2-0 provides more attack speed, which is superior on maps with lots of walls for bouncing.", "canPopCamo": true, "canPopLead": true }, { "rank": 3, "name": "Plasma Monkey Fan Club", "crosspath": "2-5-0", "notes": "The 2-5-0 crosspath provides more pierce to the base Dart Monkey and all transformed monkeys, making it far more effective against dense bloon rounds.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Crossbow Master", "crosspath": "0-2-5", "notes": "Almost always 0-2-5. The attack speed from the middle path provides a massive DPS increase that far outweighs the small pierce bonus from the top path.", "canPopCamo": true, "canPopLead": true }] },
                { "type": "Primary", "name": "Boomerang Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 3, "name": "Glaive Lord", "crosspath": "5-2-0", "notes": "5-2-0 is superior for its increased attack speed. 5-0-2 only adds red hot rangs damage, which is negligible. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Perma Charge", "crosspath": "0-5-2", "notes": "0-5-2 provides valuable camo detection and more range via red hot rangs. The extra pierce from 2-5-0 is less impactful for its primary role.", "canPopCamo": true, "canPopLead": true }, { "rank": 2, "name": "MOAB Domination", "crosspath": "2-0-5", "notes": "2-0-5 gives more pierce, crucial for hitting more MOABs. The attack speed from 0-2-5 is less effective. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Primary", "name": "Bomb Shooter", "defaultCamo": false, "defaultLead": true, "upgrades": [{ "rank": 1, "name": "Bloon Crush", "crosspath": "5-2-0", "notes": "5-2-0 provides a significant attack speed boost, allowing it to stun-lock bloons more effectively. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 2, "name": "MOAB Eliminator", "crosspath": "2-5-0", "notes": "2-5-0 is better for more damage per bomb and faster reload speed on the ability. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Bomb Blitz", "crosspath": "0-2-5", "notes": "0-2-5 offers more pierce, which is vital for its passive ability to clear the screen. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Primary", "name": "Tack Shooter", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Inferno Ring", "crosspath": "5-2-0", "notes": "5-2-0 provides much-needed extra range. The attack speed from 5-0-2 is less impactful due to the meteor's cooldown. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Super Maelstrom", "crosspath": "0-5-2", "notes": "0-5-2 gives more range and blade lifespan. Needs external lead popping power (e.g., Alchemist) and camo detection.", "canPopCamo": false, "canPopLead": false }, { "rank": 1, "name": "The Tack Zone", "crosspath": "2-0-5", "notes": "2-0-5 provides a substantial pierce increase. Needs external lead popping power and camo detection.", "canPopCamo": false, "canPopLead": false }] },
                { "type": "Primary", "name": "Ice Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Super Brittle", "crosspath": "5-2-0", "notes": "5-2-0 gives more range and affects more bloons. The refreeze from 5-0-2 is less useful. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Absolute Zero", "crosspath": "2-5-0", "notes": "2-5-0 provides a longer freeze duration and affects a larger area. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Icicle Impale", "crosspath": "0-2-5", "notes": "0-2-5 provides a much faster attack speed to permanently stall DDTs. 2-0-5 is only useful if you lack external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Primary", "name": "Glue Gunner", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 1, "name": "The Bloon Solver", "crosspath": "5-0-2", "notes": "5-0-2 allows the glue to last longer. The glue splatter from 5-2-0 is redundant. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Glue Storm", "crosspath": "2-5-0", "notes": "2-5-0 makes the glue puddles last longer. Ability does not affect camo without external support.", "canPopCamo": false, "canPopLead": false }, { "rank": 2, "name": "Super Glue", "crosspath": "0-2-5", "notes": "0-2-5 provides more pierce to stun more bloons. Needs external camo detection and lead popping power.", "canPopCamo": false, "canPopLead": false }] },
                { "type": "Military", "name": "Sniper Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Cripple MOAB", "crosspath": "5-0-2", "notes": "5-0-2 provides faster firing speed, crucial for bosses. 5-2-0 is better for grouped MOABs due to shrapnel. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Elite Sniper", "crosspath": "0-5-2", "notes": "0-5-2 is almost always better as shrapnel benefits more from buffs. This path does not pop lead without an Alchemist or MIB.", "canPopCamo": true, "canPopLead": false }, { "rank": 3, "name": "Elite Defender", "crosspath": "2-0-5", "notes": "2-0-5 provides more pierce for better single-target damage. 0-2-5 is better for grouped bloon cleanup with buffs like Geraldo's sharpening stone.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Military", "name": "Monkey Sub", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 3, "name": "Energizer", "crosspath": "5-2-0", "notes": "5-2-0 provides extra pierce. Mainly a support tower for cooldowns. Needs external camo detection and lead popping.", "canPopCamo": false, "canPopLead": false }, { "rank": 2, "name": "Pre-Emptive Strike", "crosspath": "0-5-2", "notes": "0-5-2 allows the sub to hit camo bloons, which is essential for its global missile ability to target DDTs.", "canPopCamo": true, "canPopLead": true }, { "rank": 1, "name": "Sub Commander", "crosspath": "2-0-5", "notes": "2-0-5 is the clear winner, as the extra pierce is shared with all other subs in range, enabling powerful sub armies. Needs external camo detection and lead popping power.", "canPopCamo": false, "canPopLead": false }] },
                { "type": "Military", "name": "Monkey Buccaneer", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 1, "name": "Carrier Flagship", "crosspath": "5-2-0", "notes": "5-2-0 gives faster firing. Needs top path for lead popping. Needs external camo detection, but provides it to other water towers.", "canPopCamo": false, "canPopLead": true }, { "rank": 2, "name": "Pirate Lord", "crosspath": "0-5-2", "notes": "0-5-2 provides camo detection. Needs top path (1-5-0) for lead popping power.", "canPopCamo": true, "canPopLead": false }, { "rank": 3, "name": "Trade Empire", "crosspath": "0-2-5", "notes": "0-2-5 generates more money and has camo detection. Needs top path (2-0-5) for lead popping power.", "canPopCamo": true, "canPopLead": false }] },
                { "type": "Military", "name": "Monkey Ace", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 1, "name": "Sky Shredder", "crosspath": "5-0-2", "notes": "5-0-2 provides essential camo detection and faster darts. The centered path upgrade (5-2-0) is generally less useful.", "canPopCamo": true, "canPopLead": true }, { "rank": 3, "name": "Tsar Bomba", "crosspath": "2-5-0", "notes": "2-5-0 gives more bombs and faster firing. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 2, "name": "Flying Fortress", "crosspath": "2-0-5", "notes": "2-0-5 provides more projectiles and is the superior damage path. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Military", "name": "Heli Pilot", "defaultCamo": true, "defaultLead": false, "upgrades": [{ "rank": 1, "name": "Apache Prime", "crosspath": "5-0-2", "notes": "5-0-2 provides crucial camo detection and faster darts. 5-2-0 is a viable alternative for more damage if you have other sources of camo detection.", "canPopCamo": true, "canPopLead": true }, { "rank": 3, "name": "Special Poperations", "crosspath": "0-5-2", "notes": "0-5-2 provides camo detection. The top path crosspath (2-5-0) is generally considered useless on this upgrade.", "canPopCamo": true, "canPopLead": true }, { "rank": 2, "name": "Comanche Commander", "crosspath": "2-0-5", "notes": "2-0-5 provides more projectiles and damage. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Military", "name": "Mortar Monkey", "defaultCamo": false, "defaultLead": true, "upgrades": [{ "rank": 1, "name": "The Biggest One", "crosspath": "5-2-0", "notes": "5-2-0 provides a faster firing rate. Needs external camo detection (or bottom path's Signal Flare).", "canPopCamo": false, "canPopLead": true }, { "rank": 2, "name": "Pop and Awe", "crosspath": "2-5-0", "notes": "2-5-0 provides a stun effect and faster firing. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Blooncineration", "crosspath": "0-2-5", "notes": "0-2-5 provides a faster firing rate to maximize the fire's uptime. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Military", "name": "Dartling Gunner", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Ray of Doom", "crosspath": "5-2-0", "notes": "5-2-0 provides faster swivel speed, essential for tracking fast bloons. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "M.A.D", "crosspath": "2-5-0", "notes": "2-5-0 provides faster firing speed, a massive DPS increase. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Bloon Exclusion Zone", "crosspath": "0-2-5", "notes": "0-2-5 provides faster firing speed for maximizing damage. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Primary", "name": "Desperado", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 1, "name": "Desert Phantom", "crosspath": "5-0-2", "notes": "5-0-2 increases attack speed based on proximity, making the Phantom's rapid fire even deadlier. Needs external camo detection.", "canPopCamo": false, "canPopLead": false }, { "rank": 2, "name": "Golden Justice", "crosspath": "2-5-0", "notes": "2-5-0 allows for marking more bloons for extra cash. The attack speed from top path is crucial for maximizing income.", "canPopCamo": false, "canPopLead": false }, { "rank": 3, "name": "Avenger", "crosspath": "0-2-5", "notes": "0-2-5 provides the shotgun with more pierce and knockback. Middle path buffs the ability cooldown.", "canPopCamo": false, "canPopLead": true }] },

                { "type": "Magic", "name": "Super Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 1, "name": "True Sun God", "crosspath": "5-2-0", "notes": "5-2-0 provides extra range. Needs external camo detection (or Ultravision crosspath).", "canPopCamo": false, "canPopLead": true }, { "rank": 2, "name": "The Anti-Bloon", "crosspath": "2-5-0", "notes": "2-5-0 provides more pierce. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Legend of the Night", "crosspath": "2-0-5", "notes": "2-0-5 provides more pierce. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },

                { "type": "Magic", "name": "Alchemist", "defaultCamo": false, "defaultLead": true, "upgrades": [{ "rank": 1, "name": "Permanent Brew", "crosspath": "5-2-0", "notes": "5-2-0 increases the duration of the buff potions. The Alchemist's own attack can pop Lead but not Camo.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Total Transformation", "crosspath": "0-5-2", "notes": "0-5-2 provides a faster attack speed to the transformed monster. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 2, "name": "Bloon Master Alchemist", "crosspath": "1-0-5", "notes": "Shrinking potion is unaffected by crosspaths. 1-0-5 is for the preceding upgrade. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Magic", "name": "Druid", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Superstorm", "crosspath": "5-2-0", "notes": "5-2-0 provides more pierce. Needs top path for lead popping. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Spirit of the Forest", "crosspath": "1-5-0", "notes": "1-5-0 provides lead popping power. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Avatar of Wrath", "crosspath": "0-1-5", "notes": "0-1-5 is best when buffed by Poplusts. Needs external buffs for both Camo and Lead (e.g., MIB).", "canPopCamo": false, "canPopLead": false }] },
                { "type": "Magic", "name": "Mermonkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Lord of the Abyss", "crosspath": "5-0-2", "notes": "5-0-2 is the most reliable damage crosspath. Middle path pierce is bugged. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Popseidon", "crosspath": "0-5-2", "notes": "0-5-2 provides seeking tridents, which is more useful for its widespread attacks. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Final Harmonic", "crosspath": "2-0-5", "notes": "2-0-5 increases the pull-in speed of the song, which is a direct buff to its main function. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }] },
                { "type": "Magic", "name": "Beast Handler", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 3, "name": "Giganotosaurus", "crosspath": "N/A", "notes": "Crosspathing does not affect the merged beast's stats, only the base handler's weak attack. Merge power is what matters.", "canPopCamo": true, "canPopLead": true }, { "rank": 2, "name": "Megalodon", "crosspath": "N/A", "notes": "Crosspathing does not affect the merged beast's stats. Merge power is what matters. Can only be placed on water.", "canPopCamo": true, "canPopLead": true }, { "rank": 1, "name": "Pouākai", "crosspath": "N/A", "notes": "Crosspathing does not affect the merged beast's stats. Extremely powerful global range and blowback ability.", "canPopCamo": true, "canPopLead": true }] },
                { "type": "Support", "name": "Monkey Village", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Primary Expertise", "crosspath": "5-2-0", "notes": "5-2-0 provides a primary training buff. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 1, "name": "Homeland Defense", "crosspath": "2-5-0", "notes": "2-5-0 provides a larger radius for its powerful global ability. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 3, "name": "Monkeyopolis", "crosspath": "0-2-5", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }] },
                { "type": "Support", "name": "Banana Farm", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Banana Central", "crosspath": "5-2-0", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 3, "name": "Monkey-Nomics", "crosspath": "2-5-0", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 1, "name": "Monkey Wall Street", "crosspath": "0-2-5", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }] },
                { "type": "Support", "name": "Spike Factory", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Super Mines", "crosspath": "5-2-0", "notes": "5-2-0 provides a faster production rate. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Carpet of Spikes", "crosspath": "2-5-0", "notes": "2-5-0 provides a faster production rate. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Perma-Spike", "crosspath": "0-2-5", "notes": "0-2-5 provides a much faster production rate. Needs external buffs for both Camo and Lead (e.g., MIB or 2-0-0 Alch).", "canPopCamo": false, "canPopLead": false }] },
                { "type": "Support", "name": "Engineer Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Sentry Champion", "crosspath": "5-2-0", "notes": "5-2-0 provides extra damage to MOABs. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Ultraboost", "crosspath": "0-5-2", "notes": "Crosspathing is not very impactful. 0-5-2 makes its foam slow bloons. Needs external camo and lead popping.", "canPopCamo": false, "canPopLead": false }, { "rank": 1, "name": "XXXL Trap", "crosspath": "2-0-5", "notes": "2-0-5 deploys traps much faster. Needs external camo detection to trap DDTs.", "canPopCamo": false, "canPopLead": true }] }
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            const monkeyGrid = document.getElementById('monkey-grid');
            const filterContainer = document.getElementById('filter-container');
            const searchInput = document.getElementById('search-input');
            const sortSelect = document.getElementById('sort-select');

            const camoIcon = (on) =>
                `<img src="camo.png" class="${on ? '' : 'off'}" title="${on ? 'Can pop Camo' : 'Cannot pop Camo'}" alt="${on ? 'Camo' : 'No camo'}">`;
            const leadIcon = (on) =>
                `<img src="lead.png" class="${on ? '' : 'off'}" title="${on ? 'Can pop Lead' : 'Cannot pop Lead'}" alt="${on ? 'Lead' : 'No lead'}">`;

            const getIcons = (canCamo, canLead) => {
                let html = '';
                if (canCamo === true) html += camoIcon(true);
                else if (canCamo === false) html += camoIcon(false);
                if (canLead === true) html += leadIcon(true);
                else if (canLead === false) html += leadIcon(false);
                return html ? `<div class="ability-icons">${html}</div>` : '';
            };

            const renderCrosspath = (crosspath) => {
                if (!crosspath || crosspath === 'N/A') {
                    return `<div class="crosspath"><span class="path-1" style="width:auto;padding:0 0.4rem;">N/A</span></div>`;
                }
                return `<div class="crosspath">${crosspath.split('-').map((p, i) =>
                    `<span class="path-${i}">${p}</span>`
                ).join('')}</div>`;
            };

            const renderMonkeys = () => {
                const active = filterContainer.querySelector('.active');
                const filter = active ? active.dataset.type : 'all';
                const searchTerm = searchInput.value.toLowerCase();
                const sortBy = sortSelect.value;

                monkeyGrid.innerHTML = '';

                let filteredMonkeys = crosspathData.monkeys
                    .filter(monkey => filter === 'all' || monkey.type === filter)
                    .filter(monkey => {
                        const monkeyNameMatch = monkey.name.toLowerCase().includes(searchTerm);
                        const upgradeNameMatch = monkey.upgrades.some(up => up.name.toLowerCase().includes(searchTerm));
                        return monkeyNameMatch || upgradeNameMatch;
                    });

                if (sortBy === 'name') {
                    filteredMonkeys.sort((a, b) => a.name.localeCompare(b.name));
                } else if (sortBy === 'rank') {
                    filteredMonkeys.sort((a, b) => {
                        const minRankA = Math.min(...a.upgrades.map(u => u.rank));
                        const minRankB = Math.min(...b.upgrades.map(u => u.rank));
                        return minRankA - minRankB;
                    });
                } else if (sortBy === 'type') {
                    filteredMonkeys.sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
                }

                if (filteredMonkeys.length === 0) {
                    monkeyGrid.innerHTML = `<p class="empty-state">No monkeys found. Try a different search or filter.</p>`;
                    return;
                }

                filteredMonkeys.forEach((monkey, index) => {
                    const card = document.createElement('article');
                    card.className = `monkey-card type-border-${monkey.type}`;

                    const panelId = `details-${index}-${monkey.name.replace(/\s+/g, '-').toLowerCase()}`;
                    const sortedUpgrades = [...monkey.upgrades].sort((a, b) => a.rank - b.rank);

                    card.innerHTML = `
                        <button type="button" class="card-header" aria-expanded="false" aria-controls="${panelId}">
                            <div class="card-title-wrap">
                                <h3>${monkey.name}</h3>
                                ${getIcons(monkey.defaultCamo, monkey.defaultLead)}
                            </div>
                            <div class="card-meta">
                                <span class="type-badge">${monkey.type}</span>
                                <span class="chevron" aria-hidden="true">▾</span>
                            </div>
                        </button>
                        <div class="details" id="${panelId}" role="region" hidden>
                            ${sortedUpgrades.map(upgrade => `
                                <div class="upgrade">
                                    <div class="upgrade-row">
                                        <div class="rank">#${upgrade.rank}</div>
                                        <div class="upgrade-body">
                                            <div class="upgrade-top">
                                                <div>
                                                    <h4>${upgrade.name}</h4>
                                                    <p class="crosspath-label">Best crosspath</p>
                                                </div>
                                                ${renderCrosspath(upgrade.crosspath)}
                                            </div>
                                            ${getIcons(upgrade.canPopCamo, upgrade.canPopLead)}
                                            <p class="notes">${upgrade.notes || ''}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    monkeyGrid.appendChild(card);
                });

                monkeyGrid.querySelectorAll('.card-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const card = header.parentElement;
                        const details = card.querySelector('.details');
                        const open = !card.classList.contains('open');
                        card.classList.toggle('open', open);
                        header.setAttribute('aria-expanded', open ? 'true' : 'false');
                        if (open) {
                            details.removeAttribute('hidden');
                        } else {
                            // Delay hidden until collapse finishes for animation
                            setTimeout(() => {
                                if (!card.classList.contains('open')) details.setAttribute('hidden', '');
                            }, 350);
                        }
                    });
                });
            };

            filterContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('button.filter-btn');
                if (!btn) return;
                filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderMonkeys();
            });

            searchInput.addEventListener('input', renderMonkeys);
            sortSelect.addEventListener('change', renderMonkeys);

            renderMonkeys();
        });
    </script>
</body>

</html>
